<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;

    }

    div{
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    h2{
        font-size: 2.25rem;
        line-height: 100%;
        font-weight: bold;
        margin: 0;
        letter-spacing: -0.03em;
        color: #2D2C2B;
        text-align: center;
    }

    ul {
        position: relative;
        width: 100%;
        height: 2.89rem;
        overflow: hidden;
        list-style: none;
        font-weight: bold;
        font-size: 2.25rem;
        letter-spacing: -0.03em;
        color: #2D2C2B;
        
        
    }

    li {
        position: absolute;
        inset: 0;

        animation: move-up 12s infinite;
        animation-delay: calc(var(--index) * -3s);
    }

    li:nth-child(1) {
        --index: 0;
    }

    li:nth-child(2) {
        --index: 3;
    }

    li:nth-child(3) {
        --index: 2;
    }

    li:nth-child(4) {
        --index: 1;
    }

@keyframes move-up {
    /* Tekst blijft zichtbaar */
    0%,
    20% {
        transform: translateY(0);
        opacity: 1;
    }

    /* Tekst beweegt omhoog */
    25% {
        transform: translateY(-100%);
        opacity: 0;
    }

    /* Tekst staat onder het zichtbare gedeelte */
    25.1%,
    95% {
        transform: translateY(100%);
        opacity: 0;
    }

    /* Tekst komt van onderen binnen */
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}
</style>
</head>
<body>
    <div>
        <ul>
            <li><p>Sleep better</p></li>
            <li><p>Feel less anxious</p></li>
            <li><p>Improve relationships</p></li>
            <li><p>Stress less</p></li>
        </ul>
        <h2>all with Headspace</h2>
    </div>
</body>
</html>
