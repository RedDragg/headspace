<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do-anywhere exercises</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: Arial, sans-serif;
      background: #f4f1ef;
    }

    article {
      width: min(100%, 20.5rem);
      min-height: 23.5rem;
      padding: 2rem 2.25rem;
      color: white;
      background: #078e43;
      border-radius: 1rem 1rem 0 0;
      text-align: center;
    }

    h1 {
      max-width: 15rem;
      margin: 0 auto 1.35rem;
      font-size: clamp(1.9rem, 8vw, 2.1rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
    }

    article > p {
      margin: 0 auto 1.55rem;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
    }

    section {
      display: grid;
      grid-template-columns: 3rem 1fr;
      column-gap: 1rem;
      align-items: center;
      margin: 0 auto 1.9rem;
      text-align: left;
    }

    section > button {
      grid-row: 1 / 3;
      width: 3rem;
      height: 3rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #f9f6f4;
      cursor: pointer;
    }

    section > button span {
      width: 0;
      height: 0;
      margin-left: 0.2rem;
      border-top: 0.55rem solid transparent;
      border-bottom: 0.55rem solid transparent;
      border-left: 0.8rem solid #484745;
    }

    section > button.playing span {
      width: 0.75rem;
      height: 1rem;
      margin-left: 0;
      border: 0;
      border-left: 0.25rem solid #484745;
      border-right: 0.25rem solid #484745;
    }

    h2 {
      margin: 0 0 0.45rem;
      font-size: 0.88rem;
      line-height: 1.2;
    }

    section > div {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.45rem;
      align-items: center;
      color: #82d2a5;
      font-size: 0.72rem;
    }

    input[type="range"] {
      width: 100%;
      height: 0.25rem;
      margin: 0;
      appearance: none;
      background: linear-gradient(
        to right,
        white 0%,
        white var(--progress, 0%),
        #176e40 var(--progress, 0%),
        #176e40 100%
      );
      border-radius: 99px;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 0.55rem;
      height: 0.55rem;
      appearance: none;
      background: white;
      border-radius: 50%;
    }

    input[type="range"]::-moz-range-thumb {
      width: 0.55rem;
      height: 0.55rem;
      border: 0;
      background: white;
      border-radius: 50%;
    }

    article > a {
      display: inline-block;
      min-width: 8.2rem;
      padding: 0.95rem 1.5rem;
      color: #383532;
      background: #fbf8f6;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 150ms ease, background 150ms ease;
    }

    article > a:hover {
      transform: translateY(-2px);
      background: white;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 0.2rem solid white;
      outline-offset: 0.2rem;
    }
  </style>
</head>

<body>
  <article>

    <section aria-label="Audiovoorbeeld">
      <button type="button" aria-label="Afspelen">
        <span></span>
      </button>

      <h2>Travel Sleep Tips</h2>

      <div>
        <time>0:01</time>
        <input type="range" min="1" max="315" value="1" aria-label="Voortgang audio">
        <time>5:15</time>

      </div>
<audio preload="metadata">
  <source src="audio/single-breathing.mp3" type="audio/mpeg">
</audio>
    </section>

        <section aria-label="Audiovoorbeeld">
      <button type="button" aria-label="Afspelen">
        <span></span>
      </button>

      <h2>Travel Sleep Tips</h2>

      <div>
        <time>0:01</time>
        <input type="range" min="1" max="800" value="1" aria-label="Voortgang audio">
        <time>10:00</time>

      </div>
<audio preload="metadata">
  <source src="audio/single-midnight.mp3" type="audio/mpeg">
</audio>
    </section>

        <section aria-label="Audiovoorbeeld">
      <button type="button" aria-label="Afspelen">
        <span></span>
      </button>

      <h2>Travel Sleep Tips</h2>

      <div>
        <time>0:01</time>
        <input type="range" min="1" max="334" value="1" aria-label="Voortgang audio">
        <time>5:34</time>

      </div>
<audio preload="metadata">
  <source src="audio/TWU_EPT.mp3" type="audio/mpeg">
</audio>
    </section>

    <a href="#">Learn more</a>

  </article>

  <article>

    <section aria-label="Audiovoorbeeld">
      <button type="button" aria-label="Afspelen">
        <span></span>
      </button>

      <h2>Travel Sleep Tips</h2>

      <div>
        <time>0:01</time>
        <input type="range" min="1" max="315" value="1" aria-label="Voortgang audio">
        <time>5:15</time>

      </div>
<audio preload="metadata">
  <source src="audio/single-breathing.mp3" type="audio/mpeg">
</audio>
    </section>

    

    <a href="#">Learn more</a>

  </article>

  <script>
// Selecteer alle audiospelers binnen het article.
const players = document.querySelectorAll("article section");

// Bewaar alle audio-elementen.
// Hiermee kunnen we andere audio pauzeren.
const allAudios = document.querySelectorAll("article audio");


/* Zet seconden om naar bijvoorbeeld 5:15. */
function formatTime(seconds) {
  if (!Number.isFinite(seconds)) {
    return "0:00";
  }

  const minutes = Math.floor(seconds / 60);

  const remainingSeconds = Math.floor(seconds % 60)
    .toString()
    .padStart(2, "0");

  return `${minutes}:${remainingSeconds}`;
}


/* Stel iedere audiospeler afzonderlijk in. */
players.forEach((player) => {
  // Zoek de elementen alleen binnen deze section.
  const audio = player.querySelector("audio");
  const playButton = player.querySelector("button");
  const progress = player.querySelector('input[type="range"]');
  const times = player.querySelectorAll("time");

  const currentTime = times[0];
  const durationTime = times[1];

  // Sla sections zonder audio over.
  if (!audio || !playButton || !progress) {
    return;
  }


  /* Werk de tijd en voortgangsbalk bij. */
  function updateProgress() {
    progress.value = audio.currentTime;
    currentTime.textContent = formatTime(audio.currentTime);

    const percentage =
      audio.duration > 0
        ? (audio.currentTime / audio.duration) * 100
        : 0;

    progress.style.setProperty(
      "--progress",
      `${percentage}%`
    );
  }


  /* Play- en pauzeknop. */
  playButton.addEventListener("click", () => {
    if (audio.paused) {
      /*
        Pauzeer eerst alle andere audio-elementen.
        Hierdoor kan maar één audio tegelijk afspelen.
      */
      allAudios.forEach((otherAudio) => {
        if (otherAudio !== audio) {
          otherAudio.pause();
        }
      });

      audio.play();
    } else {
      audio.pause();
    }
  });


  /* Verander de knop naar een pauzeknop. */
  audio.addEventListener("play", () => {
    playButton.classList.add("playing");
    playButton.setAttribute("aria-label", "Pauzeren");
  });


  /* Verander de knop terug naar een playknop. */
  audio.addEventListener("pause", () => {
    playButton.classList.remove("playing");
    playButton.setAttribute("aria-label", "Afspelen");
  });


  /* Lees automatisch de lengte van het audiobestand. */
  audio.addEventListener("loadedmetadata", () => {
    progress.min = 0;
    progress.max = audio.duration;

    currentTime.textContent = "0:00";
    durationTime.textContent = formatTime(audio.duration);

    updateProgress();
  });


  /* Werk de slider tijdens het afspelen bij. */
  audio.addEventListener("timeupdate", updateProgress);


  /* Spoel wanneer de gebruiker de slider verplaatst. */
  progress.addEventListener("input", () => {
    audio.currentTime = Number(progress.value);
    updateProgress();
  });


  /* Zet alles netjes terug wanneer de audio eindigt. */
  audio.addEventListener("ended", () => {
    playButton.classList.remove("playing");
    playButton.setAttribute("aria-label", "Afspelen");

    audio.currentTime = 0;
    updateProgress();
  });
});
  </script>
</body>
</html>
